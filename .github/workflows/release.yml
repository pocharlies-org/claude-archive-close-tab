name: Release

# A merge to main whose package.json version has no tag yet is a new version:
# the VSIX build and the changelog run in parallel, then both go into a
# GitHub release.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: arc-k8s
    outputs:
      version: ${{ steps.v.outputs.version }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          version=$(jq -r .version package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "v$version ya está publicada; nada que sacar." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: arc-k8s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'

  changelog:
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: arc-k8s
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gh CLI (el runner ARC no la trae)
        run: |
          v=2.103.3
          curl -fsSL "https://github.com/cli/cli/releases/download/v${v}/gh_${v}_linux_amd64.tar.gz" | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_${v}_linux_amd64/bin" >> "$GITHUB_PATH"
      - name: Changelog from the merged pull requests and their commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/changelog.sh "${{ needs.version.outputs.version }}" "$GITHUB_SHA" | cat -s > CHANGELOG-section.md
          cat CHANGELOG-section.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: CHANGELOG-section.md

  publish:
    needs: [version, build, changelog]
    # ci-runners-arc exception: ubuntu-latest on purpose (2026-11-10, owner: devops).
    # Public repository: this job writes releases with the repository token.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v${{ needs.version.outputs.version }}"
          gh release create "$v" dist/*.vsix \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$v" --notes-file dist/CHANGELOG-section.md
